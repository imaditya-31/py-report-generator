<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placement Report Generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ink: #0f1117;
        --muted: #6b7280;
        --accent: #1a56db;
        --accent-light: #eff6ff;
        --surface: #ffffff;
        --border: #e5e7eb;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: #f0f4ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            circle at 20% 20%,
            rgba(26, 86, 219, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(99, 102, 241, 0.07) 0%,
            transparent 50%
          );
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 1;
        background: var(--surface);
        border-radius: 16px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.07),
          0 20px 60px -10px rgba(15, 17, 23, 0.12);
        width: 100%;
        max-width: 520px;
        overflow: hidden;
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card-header {
        background: linear-gradient(135deg, #1a56db 0%, #3b5cf6 100%);
        padding: 2.5rem 2.5rem 2rem;
        position: relative;
        overflow: hidden;
      }

      .card-header::after {
        content: "";
        position: absolute;
        bottom: -30px;
        right: -30px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }

      .card-header::before {
        content: "";
        position: absolute;
        top: -20px;
        left: -20px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
      }

      .badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 99px;
        margin-bottom: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .card-header h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.9rem;
        color: #fff;
        line-height: 1.2;
        position: relative;
        z-index: 1;
      }

      .card-header p {
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.875rem;
        margin-top: 0.5rem;
        font-weight: 300;
        position: relative;
        z-index: 1;
      }

      .card-body {
        padding: 2.5rem;
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 2.5rem 1.5rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s ease;
        background: #fafbff;
        position: relative;
      }

      .drop-zone:hover,
      .drop-zone.drag-over {
        border-color: var(--accent);
        background: var(--accent-light);
      }

      .drop-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }

      .drop-icon {
        width: 52px;
        height: 52px;
        background: var(--accent-light);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        transition: background 0.2s;
      }

      .drop-zone:hover .drop-icon,
      .drop-zone.drag-over .drop-icon {
        background: #dbeafe;
      }

      .drop-icon svg {
        width: 24px;
        height: 24px;
        stroke: var(--accent);
      }

      .drop-zone .label {
        font-size: 0.9rem;
        color: var(--ink);
        font-weight: 500;
      }
      .drop-zone .sublabel {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 4px;
      }

      .file-list {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--accent-light);
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.82rem;
        color: var(--accent);
        font-weight: 500;
        animation: pop 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .file-item svg {
        flex-shrink: 0;
        width: 14px;
        height: 14px;
      }

      .submit-btn {
        margin-top: 1.75rem;
        width: 100%;
        background: linear-gradient(135deg, #1a56db, #3b5cf6);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px 24px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(26, 86, 219, 0.35);
      }

      .submit-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(26, 86, 219, 0.45);
      }

      .submit-btn:active {
        transform: translateY(0);
      }
      .submit-btn svg {
        width: 16px;
        height: 16px;
      }

      .footer-note {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <div class="badge">Placement Cell · Document Portal</div>
        <h1>Upload Placement<br />Documents</h1>
        <p>
          Upload document files to generate your placement analytics report.
        </p>
      </div>

      <div class="card-body">
        <form
          action="/upload"
          method="post"
          enctype="multipart/form-data"
          id="uploadForm"
        >
          <div class="drop-zone" id="dropZone">
            <input
              type="file"
              name="files"
              id="fileInput"
              multiple
              required
              accept=".xlsx,.xls,.csv,.pdf,.docx,.doc,.dotx,.dot,.docm,.dotm"
            />
            <div class="drop-icon">
              <svg
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"
                />
              </svg>
            </div>
            <p class="label">Click to browse or drag &amp; drop files</p>
            <p class="sublabel">
              Supports .xlsx, .xls, .csv, .pdf, .docx, .doc &middot; Multiple
              files allowed
            </p>
          </div>

          <div class="file-list" id="fileList"></div>

          <button type="submit" class="submit-btn">
            <svg
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Generate Report
          </button>

          <p class="footer-note">
            <svg
              width="12"
              height="12"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
              />
            </svg>
            Your files are processed securely and not stored.
          </p>
        </form>
      </div>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileList = document.getElementById("fileList");

      function renderFiles(files) {
        fileList.innerHTML = "";
        Array.from(files).forEach((f) => {
          const ext = f.name.split(".").pop().toLowerCase();
          let iconColor = "#1a56db"; // default
          if (["xlsx", "xls", "csv"].includes(ext)) iconColor = "#107c41";
          if (["pdf"].includes(ext)) iconColor = "#d32f2f";
          if (["doc", "docx"].includes(ext)) iconColor = "#2b579a";

          const div = document.createElement("div");
          div.className = "file-item";
          div.innerHTML = `
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="${iconColor}">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
      </svg>
      ${f.name}`;
          fileList.appendChild(div);
        });
      }

      fileInput.addEventListener("change", () => renderFiles(fileInput.files));
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("drag-over");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("drag-over"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        fileInput.files = e.dataTransfer.files;
        renderFiles(e.dataTransfer.files);
      });
    </script>
  </body>
</html>
